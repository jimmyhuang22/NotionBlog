name: Repository checks

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOTIONBLOG_DEVELOPMENT_MODE: offline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/game-sync/package-lock.json
      - name: Isolate Node runtime for release verification
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); console.log("Hosted Node mode:", (fs.statSync(process.execPath).mode & 0o777).toString(8));'
          node_source="$(node -p 'process.execPath')"
          node_bin="$RUNNER_TEMP/notionblog-ci-node/bin"
          install -d -m 700 "$node_bin"
          install -m 755 "$node_source" "$node_bin/node"
          cmp --silent "$node_source" "$node_bin/node"
          "$node_bin/node" -e 'const fs = require("node:fs"); if (fs.statSync(process.execPath).mode & 0o022) throw new Error("Writable Node runtime");'
          echo "$node_bin" >> "$GITHUB_PATH"
      - name: Scan committed history for private material
        env:
          PRIVACY_BASE: ${{ github.event.pull_request.base.sha }}
          PRIVACY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PRIVACY_BASE" ]; then
            node scripts/check-privacy.mjs --range "$PRIVACY_BASE..$PRIVACY_HEAD"
          else
            node scripts/check-privacy.mjs --history HEAD
          fi
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix scripts/game-sync --ignore-scripts
      - name: Check types, protocols, tests and privacy
        run: |
          umask 022
          npm run check
      - name: Build and check server traces
        run: npm run build
