name: Repository checks

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build (Node 24)
    # A private preparation run is owner-dispatched; public PRs use an isolated hosted VM.
    if: >-
      github.event.repository.private == false ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner)
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","macOS","ARM64","notionblog"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      NOTIONBLOG_DEVELOPMENT_MODE: offline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/game-sync/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix scripts/game-sync --ignore-scripts
      - name: Check types, protocols, tests and privacy
        run: |
          umask 022
          npm run check
      - name: Build and check server traces
        run: npm run build
